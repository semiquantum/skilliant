<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email | Skilliant - Complete Registration</title>
  <meta name="description" content="Enter your 6-digit confirmation code to verify your Skilliant account and activate your profile.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="Skilliant Home">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#2563EB"/>
          <path d="M9 16L14 21L23 11" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="22" cy="22" r="3" fill="#F97316"/>
        </svg>
        Skilliant<span class="accent">.</span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <div class="category-icon" style="margin: 0 auto 1.25rem; background-color: var(--primary-light); color: var(--primary);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>
        <h2>Verify Your Email</h2>
        <p>We’ve sent a 6-digit confirmation code to your email address. Please enter it below to activate your account.</p>
      </div>

      <form id="otpForm" novalidate>
        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" autofocus required aria-label="Digit 1">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" required aria-label="Digit 2">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" required aria-label="Digit 3">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" required aria-label="Digit 4">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" required aria-label="Digit 5">
          <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]*" required aria-label="Digit 6">
        </div>

        <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.9rem; color: var(--text-muted);">
          <span>Code expires in:</span>
          <strong id="otpTimer" style="color: var(--text-dark); font-variant-numeric: tabular-nums;">00:59</strong>
          <span>•</span>
          <button type="button" id="resendOtpBtn" class="text-primary" style="font-weight: 600; opacity: 0.5; pointer-events: none;">Resend Code</button>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Verify & Complete Setup</button>

        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1.5rem;">
          Need help? <a href="contact.html" class="text-primary">Contact Support</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>&copy; 2026 Skilliant Inc. All rights reserved.</p>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html" class="footer-link">Privacy</a>
          <a href="terms.html" class="footer-link">Terms</a>
          <a href="contact.html" class="footer-link">Support</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
