<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Skilliant</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo"><div class="logo-icon">S</div>Skilliant<span>.</span></a>
    </div>
  </nav>

  <div class="container" style="max-width: 440px; margin: 4rem auto; width: 100%;">
    <div class="glass-card" style="padding: 2.5rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800; text-align: center; margin-bottom: 0.5rem;">Forgot Password</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Enter your email address to receive password reset instructions.</p>

      <form onsubmit="event.preventDefault(); showToast('Reset link sent to your email address!', 'info');">
        <div style="margin-bottom: 1.5rem;">
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">Email Address</label>
          <input type="email" placeholder="user@skilliant.com" required style="width: 100%; padding: 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Instructions</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="login.html" style="font-size: 0.9rem; color: var(--primary-600); font-weight: 700;">Back to Login</a>
      </div>
    </div>
  </div>

  <footer class="footer" style="padding: 1.5rem 0;">
    <div class="container" style="text-align: center; font-size: 0.9rem;">
      © 2026 Skilliant Platform. All Rights Reserved.
    </div>
  </footer>
  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
</body>
</html>
