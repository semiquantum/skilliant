<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Skilliant</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .role-tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-main);
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition-fast);
    }
    .role-tab.active {
      background: var(--bg-card);
      color: var(--primary-600);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo"><div class="logo-icon">S</div>Skilliant<span>.</span></a>
      <div class="nav-actions">
        <button class="theme-toggle">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 460px; margin: 3rem auto; width: 100%;">
    <div class="glass-card" style="padding: 2.5rem;">
      <h2 style="font-size: 1.85rem; font-weight: 800; text-align: center; margin-bottom: 0.35rem;">Welcome Back</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Select your role to sign into your dashboard</p>

      <!-- Role Tabs Switcher -->
      <div class="role-tabs">
        <div class="role-tab active" onclick="selectRole('user', this)">User</div>
        <div class="role-tab" onclick="selectRole('labour', this)">Labour</div>
        <div class="role-tab" onclick="selectRole('contractor', this)">Contractor</div>
        <div class="role-tab" onclick="selectRole('admin', this)">Admin</div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 0.35rem;">Email Address</label>
          <input type="email" id="login-email" value="user@skilliant.com" required style="width: 100%; padding: 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
        </div>

        <div style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Password</label>
            <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--primary-600); font-weight: 600;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" value="password123" required style="width: 100%; padding: 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">Login to Dashboard</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary-600); font-weight: 700;">Register Here</a>
      </div>
    </div>
  </div>

  <footer class="footer" style="padding: 1.5rem 0;">
    <div class="container" style="text-align: center; font-size: 0.9rem;">
      © 2026 Skilliant Platform. All Rights Reserved.
    </div>
  </footer>

  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
  <script>
    let selectedRole = 'user';
    const sampleAccounts = {
      user: 'user@skilliant.com',
      labour: 'labour@skilliant.com',
      contractor: 'contractor@skilliant.com',
      admin: 'admin@skilliant.com'
    };

    function selectRole(role, element) {
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('login-email').value = sampleAccounts[role];
    }

    function handleLogin(e) {
      e.preventDefault();
      showToast(`Logging in as ${selectedRole.toUpperCase()}...`, 'success');
      setTimeout(() => {
        window.location.href = `dashboard-${selectedRole}.html`;
      }, 1000);
    }
  </script>
</body>
</html>
