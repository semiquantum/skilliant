<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Login | Skilliant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1 class="auth-title">Skilliant Superadmin</h1>
      <p class="auth-subtitle">Sign in to access control panel & platform analytics</p>
    </div>

    <form class="auth-form" id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
      <div class="input-group">
        <label for="emailInput">Admin Email Address</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="emailInput" class="input-field" placeholder="test@gmail.com" required value="test@gmail.com">
        </div>
      </div>

      <div class="input-group">
        <label for="passInput">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passInput" class="input-field" placeholder="••••••••" required value="123456789">
        </div>
      </div>

      <button type="submit" class="btn-login">
        Sign In to Portal <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
      </button>
    </form>

    <div class="demo-credentials">
      <div class="demo-title"><i class="fa-solid fa-key"></i> Authorized Credentials:</div>
      <div><strong>Email:</strong> test@gmail.com</div>
      <div><strong>Password:</strong> 123456789</div>
      <button type="button" class="demo-btn" onclick="autoFillDemo()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-fill Credentials</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    function submitLogin() {
      const email = document.getElementById('emailInput').value;
      const pass = document.getElementById('passInput').value;
      const result = handleLogin(email, pass);
      
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        alert(result.message);
      }
    }
  </script>
</body>
</html>
