<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account | Skilliant - Hire or Work</title>
  <meta name="description" content="Join Skilliant to hire background-checked tradespeople or build your skilled trade contracting business with 0% platform commission.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="Skilliant Home">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#2563EB"/>
          <path d="M9 16L14 21L23 11" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="22" cy="22" r="3" fill="#F97316"/>
        </svg>
        Skilliant<span class="accent">.</span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <span class="badge badge-secondary" style="margin-bottom: 0.75rem;">Get Started in Minutes</span>
        <h2>Create Your Account</h2>
        <p>Choose your account type to begin hiring or offering services.</p>
      </div>

      <form id="registerForm" novalidate>
        <!-- Role Selector Toggle -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem;">
          <label style="display: block; cursor: pointer;">
            <input type="radio" name="accountRole" value="customer" checked style="display: none;">
            <div class="filter-pill role-pill active" style="text-align: center; width: 100%; border-radius: var(--radius-md);">
              🏠 Hire Labour
            </div>
          </label>

          <label style="display: block; cursor: pointer;">
            <input type="radio" name="accountRole" value="worker" style="display: none;">
            <div class="filter-pill role-pill" style="text-align: center; width: 100%; border-radius: var(--radius-md);">
              ⚡ I'm a Worker / Pro
            </div>
          </label>
        </div>

        <div class="form-group">
          <label for="registerName" class="form-label">Full Name *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" id="registerName" class="form-control" placeholder="e.g. Jonathan Briggs" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="registerEmail" class="form-label">Email Address *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="registerEmail" class="form-control" placeholder="jonathan@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="registerPhone" class="form-label">Phone Number *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </span>
            <input type="tel" id="registerPhone" class="form-control" placeholder="+1 (555) 019-2834" required autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label for="registerPassword" class="form-label">Password *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="registerPassword" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <!-- Password Strength Meter -->
          <div class="strength-meter">
            <div class="strength-meter-bar"></div>
          </div>
          <div class="strength-text">Enter at least 8 characters</div>
        </div>

        <div class="form-group">
          <label for="registerConfirmPassword" class="form-label">Confirm Password *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </span>
            <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="registerTerms" required>
            <span>I agree to the <a href="terms.html" target="_blank" class="text-primary">Terms & Conditions</a> and <a href="privacy.html" target="_blank" class="text-primary">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Free Account</button>

        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1.5rem;">
          Already have an account? <a href="login.html" class="text-primary" style="font-weight: 600;">Log In here</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>&copy; 2026 Skilliant Inc. All rights reserved.</p>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html" class="footer-link">Privacy</a>
          <a href="terms.html" class="footer-link">Terms</a>
          <a href="contact.html" class="footer-link">Support</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
