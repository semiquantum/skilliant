<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Skilliant - Reset Your Credentials</title>
  <meta name="description" content="Reset your Skilliant account password safely. We will send a secure verification code to your registered email address.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="Skilliant Home">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#2563EB"/>
          <path d="M9 16L14 21L23 11" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="22" cy="22" r="3" fill="#F97316"/>
        </svg>
        Skilliant<span class="accent">.</span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="category-icon" style="margin: 0 auto 1.25rem;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h2>Reset Your Password</h2>
        <p>Enter your registered email address and we will send you a verification link to regain access.</p>
      </div>

      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="forgotEmail" class="form-label">Email Address *</label>
          <div class="input-group">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="forgotEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">Send Reset Link</button>

        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1.75rem;">
          Remembered your password? <a href="login.html" class="text-primary" style="font-weight: 600;">Back to Login</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>&copy; 2026 Skilliant Inc. All rights reserved.</p>
        <div style="display: flex; gap: 1.5rem;">
          <a href="privacy.html" class="footer-link">Privacy</a>
          <a href="terms.html" class="footer-link">Terms</a>
          <a href="contact.html" class="footer-link">Support</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
